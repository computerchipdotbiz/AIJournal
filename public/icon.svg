<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f0ff" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22d3ee" />
      <stop offset="45%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="24" fill="#0b0f19" />

  <!-- Outer Faceted Shield / PC Waterblock Chassis -->
  <polygon
    points="22,12 78,12 88,22 88,78 78,88 22,88 12,78 12,22"
    fill="url(#chassisGrad)"
    stroke="url(#neonBorder)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Top Pins -->
  <line x1="36" y1="12" x2="36" y2="18" stroke="#00f0ff" stroke-width="1.5" opacity="0.9" />
  <line x1="50" y1="12" x2="50" y2="20" stroke="#00f0ff" stroke-width="2" opacity="1" />
  <line x1="64" y1="12" x2="64" y2="18" stroke="#00f0ff" stroke-width="1.5" opacity="0.9" />

  <!-- Bottom Pins -->
  <line x1="36" y1="82" x2="36" y2="88" stroke="#a855f7" stroke-width="1.5" opacity="0.9" />
  <line x1="50" y1="80" x2="50" y2="88" stroke="#a855f7" stroke-width="2" opacity="1" />
  <line x1="64" y1="82" x2="64" y2="88" stroke="#a855f7" stroke-width="1.5" opacity="0.9" />

  <!-- Circuit Traces -->
  <path d="M 34 34 L 26 26 L 18 26" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="18" cy="26" r="1.5" fill="#00f0ff" />
  <path d="M 66 34 L 74 26 L 82 26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="82" cy="26" r="1.5" fill="#38bdf8" />
  <path d="M 34 66 L 26 74 L 18 74" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="18" cy="74" r="1.5" fill="#818cf8" />
  <path d="M 66 66 L 74 74 L 82 74" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="82" cy="74" r="1.5" fill="#c084fc" />

  <!-- Center Silicon Heatspreader / Arcane Mana Die -->
  <rect x="32" y="32" width="36" height="36" rx="7" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />

  <!-- Inner Diamond Node -->
  <polygon points="50,39 61,50 50,61 39,50" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />

  <!-- Central Singularity -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
  <circle cx="50" cy="50" r="2.5" fill="#00f0ff" />
</svg>
